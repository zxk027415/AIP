# alembic.ini - Alembic main configuration file
#
# The connection URL uses a placeholder; the real URL is injected by alembic/env.py
# from DBConfig at runtime. Do NOT put real credentials here.
#
# NOTE: This file is read by Python's configparser with the OS locale encoding
# (CP936/GBK on Chinese Windows). Keep all content ASCII-only to avoid
# UnicodeDecodeError on Windows.

[alembic]
# Migration script directory (relative to this file, i.e. backend-service/)
script_location = alembic

# Version path separator (default is space; for list format use os, : or ;)
# version_path_separator = os

# Connection URL placeholder - env.py overrides this at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname

# Version file naming pattern (default %%(rev)s_%%(slug)s)
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
# timezone =

# Truncate slug length in generated filenames
# truncate_slug_length = 40

# Enable revision environment when multiple heads exist
# revision_environment = false

# Include column type comparison when generating SQL
# compare_type = true


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that run against
# newly generated revision scripts. See Alembic documentation for details.


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
